controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-database-rw
          DB_PORT: "5432"
          DB_USERNAME: app
          DB_DATABASE_NAME: app
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password

immich:
  persistence:
    library:
      existingClaim: immich-library

server:
  service:
    main:
      type: NodePort

machine-learning:
  enabled: false

valkey:
  enabled: true
