image:
  registry: docker.io
  repository: deluan/navidrome
  tag: "0.59.0"
  pullPolicy: IfNotPresent

env:
  ND_SCANNER_PURGEMISSING: "always"
  ND_LOGLEVEL: info

persistence:
  data:
    enabled: true
    existingClaim: navidrome-data

  music:
    enabled: true
    existingClaim: navidrome-music

service:
  main:
    enabled: true
    type: NodePort
    ports:
      http:
        port: 4533
        nodePort: 30433

