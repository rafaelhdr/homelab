
name: homelab

services:

  #
  # Caddy
  # Single reverse proxy for docker compose services
  #
  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  #
  # Immich, run via containerd/nerdctl instead of Docker.
  # Based on the official compose file: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  # Keep this in sync when bumping IMMICH_VERSION - diff against the release's docker-compose.yml first.
  #
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${DATA_ROOT:-.}/library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DATA_ROOT:-.}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  #
  # AdGuard
  # Source: https://adguard-dns.io/kb/adguard-home/docker/
  # Some adaptations were made for the compose version running behind Netbird
  #
  adguardhome:
    container_name: adguardhome
    image: docker.io/adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      - '$HOMELAB_IP:53:53/tcp'
      - '$HOMELAB_IP:53:53/udp'
      - '5335:53/tcp'
      - '5335:53/udp'
    volumes:
      - ${DATA_ROOT:-.}/adguard/work:/opt/adguardhome/work
      - ${DATA_ROOT:-.}/adguard/conf:/opt/adguardhome/conf

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ${DATA_ROOT:-.}/jellyfin/config:/config
      - ${DATA_ROOT:-.}/jellyfin/cache:/cache
      - ${HOME}/media:/media:ro
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=http://media.internal

  #
  # Gitea
  # Self-hosted Git service. SQLite on a bind mount — no extra database
  # service and nothing new in .env.
  # Source: https://docs.gitea.com/installation/install-with-docker/
  #
  gitea:
    container_name: gitea
    image: docker.io/gitea/gitea:28.1.0
    restart: always
    environment:
      # Deliberately no USER_UID/USER_GID here: setting them breaks writes to
      # the ./gitea bind mount under rootless nerdctl.
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://git.internal/
      # Host port 22 is this machine's own sshd — Gitea's SSH is published on
      # 2222 and that is the port shown in clone URLs. Hide it with a
      # `Host git.internal` / `Port 2222` block in ~/.ssh/config (see README).
      - GITEA__server__SSH_PORT=2222
      # Everything is configured above; skip the first-run install wizard so
      # clone URLs are correct immediately.
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - ${DATA_ROOT:-.}/gitea:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '2222:22'

  #
  # Plik
  # Temporary file/text sharing with a web UI — drop something in from one
  # device, pick it up on another. Optional login (see below), uploads expire
  # after 30 days by default. Single Go binary, SQLite metadata.
  # Source: https://github.com/root-gg/plik
  #
  # No host port: reachable only through Caddy at http://share.internal.
  #
  plik:
    container_name: plik
    image: docker.io/rootgg/plik:1.4.3
    restart: unless-stopped
    # The image runs as UID 1000, which can't write to a bind mount created by
    # rootless nerdctl. Container root maps onto your host user, so files in
    # plik/ end up owned by you.
    user: '0:0'
    environment:
      # Default paths are relative to the image's /home/plik/server, which
      # also holds the binary — point both at the /data mount instead.
      PLIKD_DATA_BACKEND_CONFIG: '{"Directory":"/data/files"}'
      PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"sqlite3","ConnectionString":"/data/plik.db"}'
      # Login is optional: anonymous uploads still work, but uploads made while
      # logged in show up under "My uploads" on every device.
      PLIKD_FEATURE_AUTHENTICATION: enabled
      # Created on first start. No password set here on purpose: Plik generates
      # one and logs it once — read it with `nerdctl logs plik`.
      PLIKD_DEFAULT_ADMIN_LOGIN: admin
      # Behind Caddy: take the client IP from the forwarded header, not Caddy's.
      PLIKD_SOURCE_IP_HEADER: X-Forwarded-For
    volumes:
      - ${DATA_ROOT:-.}/plik:/data

  #
  # Multica
  # Issue tracker where AI coding agents are assignees: assign an issue and an
  # agent CLI (Claude Code, Codex, ...) picks it up through a daemon. The
  # server never runs agents itself — the `multica` daemon does, on whatever
  # machine has the agent CLI logged in (see README).
  # Source: https://github.com/multica-ai/multica (docker-compose.selfhost.yml)
  #
  # No host ports: reachable only through Caddy at http://kanban.internal,
  # which sends /ws to the backend and everything else to the frontend (the
  # frontend proxies /api, /auth and /health to the backend itself).
  #
  multica-backend:
    container_name: multica_backend
    image: ghcr.io/multica-ai/multica-backend:v0.13.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://multica:${MULTICA_DB_PASSWORD:?Set MULTICA_DB_PASSWORD in .env}@multica-postgres:5432/multica?sslmode=disable
      # Signs auth/daemon JWTs and upload URLs: `openssl rand -hex 32`.
      JWT_SECRET: ${MULTICA_JWT_SECRET:?Set MULTICA_JWT_SECRET in .env}
      # The backend's origin allowlist defaults to localhost: without these the
      # WebSocket upgrade from kanban.internal is refused with 403.
      FRONTEND_ORIGIN: http://kanban.internal
      MULTICA_APP_URL: http://kanban.internal
      # URL shown in the Settings -> Runtimes daemon setup commands.
      MULTICA_DAEMON_SERVER_URL: http://kanban.internal
      # No mail server: the login code is printed to the backend log instead —
      # `nerdctl logs multica_backend 2>&1 | grep 'Verification code'`.
      APP_ENV: production
      # Off by default upstream: a daily anonymous snapshot to telemetry.multica.ai.
      DO_NOT_TRACK: '1'
      # Self-host Gitea/Forgejo integration needs MULTICA_VCS_SECRET_KEY too;
      # left off until that's wanted.
      MULTICA_VCS_INTEGRATION_ENABLED: 'false'
    volumes:
      - ${DATA_ROOT:-.}/multica/uploads:/app/data/uploads
    # Ignored by nerdctl; the backend retries the DB for up to 3m on its own.
    depends_on:
      - multica-postgres

  multica-frontend:
    container_name: multica_frontend
    image: ghcr.io/multica-ai/multica-web:v0.13.0
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      REMOTE_API_URL: http://multica-backend:8080
    depends_on:
      - multica-backend

  multica-postgres:
    container_name: multica_postgres
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${MULTICA_DB_PASSWORD:?Set MULTICA_DB_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT:-.}/multica/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U multica -d multica']
      interval: 10s
      timeout: 5s
      retries: 5

  #
  # Hermes
  # AI agent over Matrix. One gateway process multiplexes two profiles from a
  # single /opt/data: the empty default profile acts as the host and both
  # agents live as named peers under profiles/ — neither is "the main one".
  # Xiaomi MiMo for inference.
  # Source: https://github.com/NousResearch/hermes-agent
  # Setup: hermes/README.md — config, cron and secrets must be seeded first.
  #
  # Outbound only (matrix.org, api.xiaomimimo.com): no ports are published on
  # the gateway. The dashboard runs in-process (HERMES_DASHBOARD below) and is
  # reachable solely via Caddy.
  #
  # HERMES_UID/HERMES_GID below pin the container UID to 1000 so rootless
  # containerd maps it onto host 100999, matching gitea. They cannot produce
  # host UID 1000 — rootless userns mapping is fixed — so files in hermes-data/
  # are owned by 100999 and the two .env files need mode 0666 to be editable
  # by you as well. See hermes/README.md#ownership.
  #
  hermes:
    container_name: hermes
    image: docker.io/nousresearch/hermes-agent:v0.21.6
    restart: always
    environment:
      # Pins the container-side UID so rootless containerd maps it onto host
      # 100999 — the same subuid gitea's data lands on. It does NOT make files
      # owned by your host user: the userns mapping is fixed and no value here
      # yields host UID 1000. Drop it and the image's baked UID maps to a
      # different subuid (109999), which desyncs from a tree you already
      # chowned. See hermes/README.md#ownership.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
    volumes:
      - ${DATA_ROOT:-.}/hermes-data:/opt/data
      # Personas are read-only prompts, so they stay in git. config.yaml and
      # cron/jobs.json are seeded into hermes-data/ instead — Hermes mutates
      # both. Editing a persona needs `compose up -d --force-recreate`, not a
      # restart: a replaced file gets a new inode and a running container keeps
      # reading the old one.
      - ./hermes/ons-thuis/AGENTS.md:/opt/data/profiles/ons-thuis/AGENTS.md:ro
      - ./hermes/ons-thuis/SOUL.md:/opt/data/profiles/ons-thuis/SOUL.md:ro
      - ./hermes/root/AGENTS.md:/opt/data/profiles/root/AGENTS.md:ro
      - ./hermes/root/SOUL.md:/opt/data/profiles/root/SOUL.md:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["gateway", "run"]

volumes:
  model-cache:
  caddy-data:
  caddy-config:
